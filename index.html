const MONMSG=[['ILS TE','VOIENT'],['TOUT VA','BIEN'],['REGARDE','DERRIERE'],['COURS !',''],['BONSOIR','GARDIEN'],['TU ES','SEUL ?'],['IL SOURIT','']];
let save={night:1,best:1,deaths:0,stars:0};
try{const s=JSON.parse(localStorage.getItem('cirque5'));if(s&&s.night)save=Object.assign(save,s);}catch(e){}

let mode='title',S=null,muted=false,T=0;

/* ================= AUDIO ================= */
let ac=null,mg=null,bus=null,nb=null,buzzG=null,droneG=null,tensG=null,DC=null;
function distCurve(k){const n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function audioInit(){
 if(ac){if(ac.state==='suspended')ac.resume();return;}
 try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
 mg=ac.createGain();mg.gain.value=muted?0:.8;mg.connect(comp);comp.connect(ac.destination);
 bus=ac.createGain();bus.connect(mg);
 const len=(ac.sampleRate*2.4)|0,ir=ac.createBuffer(2,len,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
 const cvl=ac.createConvolver();cvl.buffer=ir;const rg=ac.createGain();rg.gain.value=.3;bus.connect(cvl);cvl.connect(rg);rg.connect(mg);
 const nl=ac.sampleRate;nb=ac.createBuffer(1,nl,ac.sampleRate);
 const nd=nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
 DC=distCurve(60);
 droneG=ac.createGain();droneG.gain.value=.03;
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160;
 const lfo=ac.createOscillator();lfo.frequency.value=.12;const lg=ac.createGain();lg.gain.value=60;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
 [55,55.7,82.4].forEach(f=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
 lp.connect(droneG);droneG.connect(mg);
 tensG=ac.createGain();tensG.gain.value=0;
 [660,667].forEach(f=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(tensG);o.start();});
 tensG.connect(mg);
 const ws=ac.createBufferSource();ws.buffer=nb;ws.loop=true;
 const wf=ac.createBiquadFilter();wf.type='bandpass';wf.frequency.value=500;wf.Q.value=.8;
 const wg=ac.createGain();wg.gain.value=.018;
 const wl=ac.createOscillator();wl.frequency.value=.07;const wlg=ac.createGain();wlg.gain.value=250;wl.connect(wlg);wlg.connect(wf.frequency);wl.start();
 ws.connect(wf);wf.connect(wg);wg.connect(mg);ws.start();
 const bz=ac.createOscillator();bz.type='square';bz.frequency.value=120;
 buzzG=ac.createGain();buzzG.gain.value=0;bz.connect(buzzG);buzzG.connect(mg);bz.start();
}
function tone(f,d,type,v,slide,delay){
 if(!ac||muted)return;type=type||'square';v=v==null?.15:v;slide=slide||0;delay=delay||0;
 const t=ac.currentTime+delay;const o=ac.createOscillator(),gn=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
 gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(gn);gn.connect(bus);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,ff,type,delay){
 if(!ac||muted)return;v=v||.2;ff=ff||800;type=type||'lowpass';delay=delay||0;
 const t=ac.currentTime+delay;const s=ac.createBufferSource();s.buffer=nb;s.loop=true;
 const f=ac.createBiquadFilter();f.type=type;f.frequency.value=ff;
 const gn=ac.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(gn);gn.connect(bus);s.start(t);s.stop(t+d+.02);
}
function vox(f,d,v,delay,form,slide){
 if(!ac||muted)return;delay=delay||0;form=form||900;
 const t=ac.currentTime+delay;const o=ac.createOscillator(),fl=ac.createBiquadFilter(),gn=ac.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
 fl.type='bandpass';fl.frequency.value=form;fl.Q.value=5;
 gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+d*.2);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(fl);fl.connect(gn);gn.connect(bus);o.start(t);o.stop(t+d+.05);
}
const sDoor=()=>{noise(.3,.6,260);tone(60,.4,'sine',.6,-25);tone(900,.5,'triangle',.06,-300,.02);tone(130,.2,'square',.12,-60);};
const sBang=()=>{noise(.5,.9,700);tone(55,.7,'sine',.7,-20);tone(110,.25,'square',.25,-50);tone(1400,.6,'triangle',.1,-600,.02);noise(.4,.35,3000,'bandpass',.03);};
const sStep=()=>{tone(75+rnd(25),.13,'sine',.35,-30);noise(.07,.14,200+rnd(150));};
const sClick=()=>{tone(1200,.04,'square',.07);tone(700,.05,'square',.07,0,.05);};
const sCamOn=()=>{noise(.18,.18,2500,'bandpass');tone(300,.22,'sawtooth',.05,900);tone(1800,.04,'square',.05,0,.2);};
const sCamOff=()=>{noise(.14,.16,1800,'bandpass');tone(900,.18,'sawtooth',.05,-700);};
const sSwitch=()=>{noise(.12,.25,3000,'bandpass');tone(1200,.04,'square',.06);};
const sLight=()=>{tone(220,.08,'sawtooth',.1,40);noise(.06,.1,4000,'highpass');};
const sStab=()=>{[1760,1865,2093].forEach(k=>tone(k,.7,'sawtooth',.12,-300));noise(.35,.35,4500,'highpass');tone(90,.4,'sine',.4,-30);};
const sClank=()=>{tone(200,.3,'square',.2,-100);noise(.3,.3,2000,'bandpass');tone(150,.3,'triangle',.3,0,.15);tone(1000,.5,'triangle',.06,-400,.05);};
const sBreath=()=>noise(.7,.12,600,'bandpass');
const sBabble=()=>vox(110+rnd(70),.1,.05,0,500+rnd(500));
const sRing=()=>{for(let i=0;i<2;i++){tone(440,.38,'sine',.2,0,i*.5);tone(480,.38,'sine',.2,0,i*.5);}};
const sPhoneRing=()=>{for(let i=0;i<8;i++)tone(i%2?1400:1100,.06,'square',.08,0,i*.07);};
const sPickup=()=>{tone(300,.08,'square',.08);noise(.08,.1,1500,'bandpass');};
const sChime=()=>{[523,659,784,1047,1319].forEach((f,i)=>{tone(f,1.4,'sine',.2,0,i*.3);tone(f*2.01,.8,'sine',.06,0,i*.3);});};
const sBell=()=>{tone(784,1.2,'sine',.16);tone(1570,.8,'sine',.05);tone(392,1.5,'sine',.1);};
const sPow=()=>{tone(500,1.4,'sawtooth',.25,-440);tone(250,1.6,'square',.15,-200);noise(1,.4,400);tone(60,.8,'sine',.6,-20,.1);};
const sBoing=()=>{tone(150,.5,'sine',.35,600);tone(900,.3,'square',.1,-500,.1);noise(.2,.2,1500,'bandpass');};
const sScratch=()=>{for(let i=0;i<4;i++)noise(.07,.2,3500,'highpass',i*.09);};
const sWhisper=()=>{noise(1.2,.22,2500,'bandpass');vox(220,1.3,.05,0,1800,-60);vox(231,1.3,.04,.05,1900,-60);};
const sHeart=()=>{tone(55,.18,'sine',.55,-20);tone(48,.22,'sine',.45,-18,.17);noise(.1,.1,120);};
const sCymbal=()=>{noise(.8,.3,6000,'highpass');noise(.4,.2,3500,'bandpass');[3300,4100,5200,6300].forEach((f,i)=>tone(f,.5,'square',.03,-200,i*.003));};
const sMusicBox=f=>{tone(f,.9,'sine',.13);tone(f*2,.6,'sine',.06);tone(f*3,.3,'sine',.03);};
const sCreak=()=>{tone(70+rnd(30),.9,'sawtooth',.05,70);noise(.9,.06,500+rnd(300),'bandpass');};
const sLaugh=()=>{for(let i=0;i<6;i++)vox(520-i*25,.12,.06,i*.17,1500);};
const sThud=()=>{tone(50,.5,'sine',.3,-15);noise(.3,.15,150);};
const sFarSteps=()=>{for(let i=0;i<4;i++)tone(70,.1,'sine',.15,-20,i*.45);};
const sMetal=()=>{tone(1200,.5,'triangle',.05,-200);noise(.2,.08,5000,'highpass');};
const sBoxFar=()=>{[523,659,784,659,523,392].forEach((f,i)=>tone(f,.8,'sine',.04,0,i*.4));};
const sGlitch=()=>{noise(.15,.3,5000,'highpass');tone(2000,.05,'square',.05);};
const sSqueak=()=>tone(1800,.08,'triangle',.05,-400);
const sSparkle=()=>{[1319,1568,2093].forEach((f,i)=>tone(f,.25,'sine',.06,0,i*.08));};
const sStar=()=>{[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.4,'sine',.12,0,i*.07));};
const sHonk=()=>{tone(220,.18,'sawtooth',.2,40);tone(190,.2,'square',.1,30,.02);};
const sHoot=()=>{vox(380,.3,.25,0,900,-80);vox(330,.5,.25,.35,900,-60);};
const sFan=()=>noise(.3,.15,1200,'bandpass');
const sSnap=()=>{noise(.06,.3,3000,'highpass');tone(100,.2,'sine',.3,-40);};
function sScream(){
 if(navigator.vibrate)try{navigator.vibrate([200,60,300,60,400]);}catch(e){}
 if(!ac||muted)return;
 const t=ac.currentTime;
 const sh=ac.createWaveShaper();sh.curve=DC;const sg=ac.createGain();sg.gain.value=.45;sh.connect(sg);sg.connect(mg);
 for(let k=0;k<5;k++){
  const o=ac.createOscillator(),gn=ac.createGain();o.type=k%2?'sawtooth':'square';
  const f0=420+k*140;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*2.2,t+.5);o.frequency.linearRampToValueAtTime(f0*1.5,t+1.7);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.18,t+.04);gn.gain.exponentialRampToValueAtTime(.0001,t+1.8);
  o.connect(gn);gn.connect(sh);o.start(t);o.stop(t+1.9);
 }
 noise(1.8,.7,1800,'bandpass');noise(1.4,.45,5000,'highpass');
 tone(45,1.6,'sine',.8,-10);tone(90,.8,'square',.3,-30);
}
function ambient(){
 if(rnd(4)===0&&S){S.sh={t:1.3,side:rnd(2)?'L':'R'};sFarSteps();return;}
 [sCreak,sLaugh,sThud,sBoxFar,sFarSteps,sMetal,()=>vox(150,1,.04,0,700,-30)][rnd(7)]();
}

/* ================= PIXEL FONT ================= */
const GL={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'%':'101001010100101',':':'000010000010000','-':'000000111000000','.':'000000000000010','!':'010010010000010','?':'110001010000010','/':'001001010100100','^':'010111101000000',' ':'000000000000000'};
function txtW(s,sc){return s.length*4*sc-sc;}
function txt(s,x,y,sc,col,al,sh){
 s=String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 sc=sc||1;col=col||'#fff';
 const w=txtW(s,sc);
 if(al==='c')x-=w/2;else if(al==='r')x-=w;
 x=Math.round(x);y=Math.round(y);
 for(let pass=sh===false?1:0;pass<2;pass++){
  const c=pass===0?'#000':col,ox=pass===0?sc:0;
  for(let i=0;i<s.length;i++){
   const gl=GL[s[i]]||GL[' '];
   for(let k=0;k<15;k++)if(gl[k]==='1')R(x+i*4*sc+(k%3)*sc+ox,y+((k/3)|0)*sc+ox,sc,sc,c);
  }
 }
}
function reg(id,x,y,w,h,down){nr.push({id,x,y,w,h,down});}
function spawn(x,y,n,col,sp,life,gr){if(!S)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*sp;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,l:life*(.6+Math.random()*.6),m:life,c:col,g:gr||0});}if(S.parts.length>220)S.parts.splice(0,S.parts.length-220);}
function updParts(dt){for(let i=S.parts.length-1;i>=0;i--){const q=S.parts[i];q.l-=dt;if(q.l<=0){S.parts.splice(i,1);continue;}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}}
function drawParts(){for(const q of S.parts){g.globalAlpha=Math.max(0,Math.min(1,q.l/q.m*1.5));R(q.x,q.y,2,2,q.c);}g.globalAlpha=1;}
function shake(a){if(S)S.shk=Math.max(S.shk||0,a);}
function slam(side){shake(.35);const x=side==='L'?33:287;spawn(x,90,26,'#ffd23a',90,.7,160);spawn(x,90,10,'#ff7a1a',60,.9,160);}
function moths(x,y,n){for(let i=0;i<n;i++){const a=T*(2+i*.7)+i*2,mx=x+Math.cos(a)*(10+i*4),my=y+Math.sin(a*1.3)*(8+i*3);R(mx,my,1,1,'#fff');R(mx-1,my,1,1,'rgba(255,255,255,.5)');}}
function btn(id,x,y,w,h,label,o){
 o=o||{};
 const face=o.face||'#8a2a2a',edge=o.edge||'#4a1414',hi=o.hi||'#c85a5a';

 const kk=Math.min(1,(T-(S.wt||T))/3),y=120+(1-kk)*60+Math.sin(T)*3;
 R(140,y-10,40,40,'#fff2a0');R(146,y-16,28,6,'#fff2a0');R(146,y+30,28,6,'#fff2a0');
 for(let i=0;i<8;i++){const a=i*Math.PI/4+T*.5;R(160+Math.cos(a)*38,y+10+Math.sin(a)*38,5,5,'#ffe14a');}
 for(let i=0;i<4;i++){const cx=((T*8+i*90)%(W+80))-40;R(cx,30+i*18,26,6,'rgba(255,255,255,.35)');R(cx+6,26+i*18,14,6,'rgba(255,255,255,.35)');}
 R(0,150,W,30,'#101018');
 for(let i=0;i<40;i++){const x=(i*29+T*20)%W;R(x,(i*47+T*40)%150,3,3,['#f55','#5f5','#55f','#ff5'][i%4]);}
}

/* ================= GAME LOGIC ================= */
function startNight(n){
 audioInit();
 try{if('ontouchstart' in window){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}}catch(e){}
 const L=LV[n];
 S={n,t:0,power:100,dL:false,dR:false,lL:false,lR:false,vent:false,aL:0,aR:0,aV:0,cam:false,camId:1,camFlash:0,
  bob:{s:0,tm:rnd(3),dt:0,lvl:L.b},owl:{s:0,tm:rnd(3),dt:0,lvl:L.o},pin:{p:0,tm:0,run:0,st:0,lvl:L.p},
  mim:{lvl:L.m,e:100,out:false,ot:0,note:0,nt:0},
  spi:{lvl:L.t,v:0,tm:0,dt:0},
  spc:{lvl:L.s,tm:0,act:false,t:0,x:160,y:80},
  zoz:{lvl:L.z,r:0,ct:0},
  mime:{lvl:L.n,p:0,tm:0,here:false,ht:0},
  dir:{lvl:L.d,tm:0,ring:false,rt:0,rng:0},
  fan:true,gold:{on:false,t:0,side:'L'},gT:20+rnd(20),pop:{t:0,txt:''},mon:{t:0,l:['','']},mT:12+rnd(14),
  glitch:0,glt:0,glT:10+rnd(10),bh:.5,sh:{t:0,side:'L'},
  fear:0,hb:0,parts:[],shk:0,camTr:0,hp:{t:0,txt:''},intro:3.2,ambT:8+rnd(8),lastHour:0,
  wind:false,use:1,js:null,black:false,bt:0,bTarget:7+rnd(8),callT:0,bab:0,breath:0,flick:0,lastNote:-1};
 mode='play';$('screen').style.display='none';$('msg').style.display='none';
 if(droneG)droneG.gain.value=.03;
}
function showCall(txt){const m=$('msg');m.innerHTML=txt+'<small>(touche pour couper l\'appel)</small>';m.style.display='block';}
function hideCall(){$('msg').style.display='none';if(S)S.callT=0;}
$('msg').addEventListener('pointerdown',e=>{e.stopPropagation();hideCall();});
function ok(){return mode==='play'&&S&&!S.js&&!S.black&&!S.cam&&!(S.intro>0);}
function toggleDoor(side){if(!ok())return;if(side==='L')S.dL=!S.dL;else S.dR=!S.dR;sDoor();spawn(side==='L'?33:287,60,8,'#8a8f9c',30,.6,0);}
function toggleVent(){if(!ok())return;S.vent=!S.vent;sDoor();}
function toggleLight(side){
 if(!ok())return;
 const k=side==='L'?'lL':'lR';S[k]=!S[k];sLight();
 if(S[k]){const ent=side==='L'?S.bob:S.owl;
  if(ent.s===2||(side==='L'&&S.pin.p===3&&S.pin.run>1.8))sStab();}
}
function toggleCam(){
 if(mode!=='play'||!S||S.js||S.black||S.intro>0)return;
 S.cam=!S.cam;S.camFlash=.2;S.camTr=.28;S.wind=false;
 if(S.cam){sCamOn();hideCall();if(S.spc.act){S.spc.act=false;S.spc.tm=-2;}}else sCamOff();
}
function selCam(i){if(!S||!S.cam)return;S.camId=i;S.camFlash=.15;sSwitch();}
function clickPoster(side){
 if(!ok())return;
 if(S.gold.on&&S.gold.side===side){S.gold.on=false;save.stars++;persist();S.pop={t:1.8,txt:'ETOILE TROUVEE !'};sStar();spawn(side==='L'?77:243,33,30,'#ffd23a',70,1,60);return;}
 if(side==='L')sHonk();else sHoot();
}
function clickMon(){if(!ok()||S.mon.t>0)return;S.mon.l=MONMSG[rnd(MONMSG.length)];S.mon.t=2.5;sGlitch();}
function clickBobble(){if(!ok())return;S.bh=3;tone(1100,.1,'square',.1,300);}
function clickFan(){if(!ok())return;S.fan=!S.fan;sFan();}
function answerPhone(){
 if(!ok()||!S.dir.ring)return;
 S.dir.ring=false;S.dir.tm=-4;sPickup();
 showCall(DLINES[rnd(DLINES.length)]);S.callT=4;S.bab=0;
}
function kill(type){
 if(!S||S.js)return;
 hideCall();S.cam=false;S.wind=false;S.js={type,t:0,pw:S.black};sScream();
}
function blackout(){
 S.black=true;S.bt=0;S.bTarget=7+rnd(8);S.dL=S.dR=S.lL=S.lR=S.vent=false;S.cam=false;S.wind=false;
 S.aL=0;S.aR=0;S.aV=0;S.spc.act=false;S.mime.here=false;S.dir.ring=false;S.zoz.r=0;sPow();shake(.5);spawn(160,70,40,'#ffd23a',120,1,200);hideCall();
}
function guard(a,side){
 const owl=a===S.owl,dt=S._dt;
 if(!a.lvl)return;
 if(a.s<2){
  a.tm+=dt;
  if(a.tm>=4.5){a.tm=0;
   const watched=owl&&S.cam&&S.camId===(a.s===0?1:3);
   if(!watched&&rnd(20)<a.lvl){a.s++;a.dt=0;sStep();}
  }
 }else{
  a.dt+=dt;const wait=Math.max(2.2,5.2-S.n*.45);
  if(a.dt>=wait){
   const cl=side==='L'?(S.dL&&S.aL>.7):(S.dR&&S.aR>.7);
   if(cl){sBang();slam(side);a.s=rnd(2);a.tm=-2;a.dt=0;S.power=Math.max(0,S.power-1);}
   else kill(owl?'o':'b');
  }
 }
}
function pinStep(){
 const p=S.pin,dt=S._dt;if(!p.lvl)return;p.tm+=dt;
 if(p.p<3){
  if(p.tm>=6){p.tm=0;
   if(S.cam&&S.camId===4){if(p.p>0&&rnd(100)<40)p.p--;}
   else if(rnd(20)<p.lvl){p.p++;if(p.p===3){p.run=0;p.st=0;sClank();}}
  }
 }else{
  p.run+=dt;p.st-=dt;if(p.st<=0){p.st=.3;sStep();}
  if(p.run>=Math.max(2.4,3.6-S.n*.2)){
   const cl=S.dL&&S.aL>.7;
   if(cl){sBang();slam('L');S.power=Math.max(0,S.power-6);p.p=1;p.tm=0;}
   else kill('p');
  }
 }
}
function mimStep(){
 const m=S.mim,dt=S._dt;if(!m.lvl)return;
 if(S.wind&&S.cam&&S.camId===5)m.e=Math.min(100,m.e+dt*45);
 else m.e=Math.max(0,m.e-dt*(2+m.lvl*.35));
 if(!m.out){
  m.nt-=dt;
  if(m.e>0&&m.nt<=0){m.nt=.5+(1-m.e/100)*.9;sMusicBox([523,659,784,659][m.note++%4]*(S.cam&&S.camId===5?1:.5));}
  if(m.e<=0){m.out=true;m.ot=0;sBoing();}
 }else{
  m.ot+=dt;
  if(m.e>=25){m.out=false;sClick();}
  else if(m.ot>=Math.max(3,6.5-S.n*.4))kill('m');
 }
}
function spiStep(){
 const s=S.spi,dt=S._dt;if(!s.lvl)return;
 if(s.v<2){s.tm+=dt;if(s.tm>=5.5){s.tm=0;if(rnd(20)<s.lvl){s.v++;s.dt=0;sScratch();}}}
 else{
  s.dt+=dt;const wait=Math.max(2.6,5-S.n*.35);
  if(s.dt>=wait){
   if(S.vent&&S.aV>.7){sBang();shake(.3);spawn(160,30,22,'#ffd23a',80,.7,160);s.v=0;s.tm=-3;S.power=Math.max(0,S.power-1);}
   else kill('t');
  }
 }
}
function spcStep(){
 const c=S.spc,dt=S._dt;if(!c.lvl)return;
 if(!c.act){c.tm+=dt;if(c.tm>=7){c.tm=0;if(!S.cam&&rnd(20)<c.lvl){c.act=true;c.t=0;c.x=80+rnd(160);c.y=60+rnd(30);sWhisper();}}}
 else{c.t+=dt;if(c.t>=Math.max(3.5,6-S.n*.4))kill('s');}
}
function zozStep(){
 const z=S.zoz,dt=S._dt;if(!z.lvl)return;
 if(S.cam){
  if(S.camId===8)z.r=Math.max(0,z.r-dt*3);
  else z.r=Math.min(100,z.r+dt*(2+z.lvl*.9));
 }else z.r=Math.max(0,z.r-dt*8);
 if(z.r>25){z.ct-=dt;if(z.ct<=0){sCymbal();if(z.r>55)shake(.15);z.ct=Math.max(.35,1.8-z.r/100*1.5);}}
 if(z.r>=100)kill('z');
}
function mimeStep(){
 const m=S.mime,dt=S._dt;if(!m.lvl)return;
 if(m.here){m.ht+=dt;if(m.ht>=Math.max(2.6,4.2-S.n*.25)){m.here=false;m.p=0;m.tm=-3;sBreath();}return;}
 m.tm+=dt;
 if(m.tm>=4.8){m.tm=0;
  const watched=S.cam&&S.camId===7;
  if(!watched&&rnd(20)<m.lvl){
   if(m.p<3){m.p++;sSqueak();}
   else if(!S.cam){m.here=true;m.ht=0;sStab();}
  }
 }
}
function dirStep(){
 const d=S.dir,dt=S._dt;if(!d.lvl)return;
 if(!d.ring){d.tm+=dt;if(d.tm>=13){d.tm=0;if(rnd(20)<d.lvl){d.ring=true;d.rt=0;d.rng=0;}}}
 else{
  d.rt+=dt;d.rng-=dt;if(d.rng<=0){sPhoneRing();d.rng=1.4;}
  if(d.rt>=Math.max(5,8-S.n*.5))kill('d');
 }
}
function calcFear(dt){
 let f=0;
 if(S.bob.s===1||S.owl.s===1)f=.15;
 if(S.bob.s===2||S.owl.s===2)f=Math.max(f,.65);
 if(S.pin.p===2)f=Math.max(f,.3);
 if(S.pin.p===3)f=Math.max(f,.85);
 if(S.mim.out)f=Math.max(f,.55+Math.min(.3,S.mim.ot/8));
 if(S.spi.v===2)f=Math.max(f,.6);
 if(S.spc.act)f=Math.max(f,.5);
 if(S.zoz.r>40)f=Math.max(f,S.zoz.r/110);
 if(S.mime.here)f=1;else if(S.mime.p>=3)f=Math.max(f,.45);
 if(S.dir.ring)f=Math.max(f,.4+S.dir.rt/12);
 if(S.black)f=.7;
 f=Math.min(1,f);
 S.fear+=(f-S.fear)*Math.min(1,dt*3);
 S.hb-=dt;
 if(S.fear>.28&&S.hb<=0){sHeart();S.hb=1.15-S.fear*.7;}
 if(droneG)droneG.gain.value=.03+S.fear*.04;
 if(tensG)tensG.gain.value=muted?0:S.fear*S.fear*.03;
}
function update(dt){
 for(const k in PR)if(PR[k]>0)PR[k]-=dt;
 if(S.js){S.js.t+=dt;if(S.js.t>1.9)gameOver();return;}
 if(S.intro>0){S.intro-=dt;if(S.intro<=0){S.callT=12;showCall(CALLS[S.n-1]);sRing();}return;}
 S.t+=dt;S._dt=dt;
 if(S.t>=HOUR*6){win();return;}
 const hr=Math.min(6,(S.t/HOUR)|0);
 if(hr!==S.lastHour){S.lastHour=hr;sBell();S.hp={t:2.2,txt:HRS[hr]};}
 if(S.camFlash>0)S.camFlash-=dt;
 if(S.camTr>0)S.camTr-=dt;
 const use=1+(S.dL?1:0)+(S.dR?1:0)+(S.lL?1:0)+(S.lR?1:0)+(S.vent?1:0)+(S.cam?1:0);
 S.use=use;
 if(!S.black){
  S.power-=use*.1*(1+(S.n-1)*.07)*dt;
  if(S.power<=0){S.power=0;blackout();}
 }
 const sp=dt*4;
 S.aL=S.dL?Math.min(1,S.aL+sp):Math.max(0,S.aL-sp);
 S.aR=S.dR?Math.min(1,S.aR+sp):Math.max(0,S.aR-sp);
 S.aV=S.vent?Math.min(1,S.aV+sp):Math.max(0,S.aV-sp);
 if(buzzG)buzzG.gain.value=((S.lL||S.lR)&&!muted)?.04:0;
 calcFear(dt);
 if(S.bh>.5)S.bh=Math.max(.5,S.bh-dt*1.5);
 if(S.sh.t>0)S.sh.t-=dt;
 updParts(dt);if(S.shk>0)S.shk=Math.max(0,S.shk-dt*1.5);if(S.hp.t>0)S.hp.t-=dt;
 if(S.glitch>0)S.glitch-=dt;
 if(S.pop.t>0)S.pop.t-=dt;
 if(S.mon.t>0)S.mon.t-=dt;
 if(S.black){
  S.bt+=dt;const n=(S.bt/.55)|0;
  if(n!==S.lastNote){S.lastNote=n;const m=[392,494,587,494,392,330,392,0];const f=m[n%m.length];if(f)sMusicBox(f*1.5);}
  if(S.bt>=S.bTarget)kill('b');
  return;
 }
 guard(S.bob,'L');if(S.js)return;
 guard(S.owl,'R');if(S.js)return;
 pinStep();if(S.js)return;
 mimStep();if(S.js)return;
 spiStep();if(S.js)return;
 spcStep();if(S.js)return;
 zozStep();if(S.js)return;
 mimeStep();if(S.js)return;
 dirStep();if(S.js)return;
 S.breath-=dt;
 if((S.bob.s===2||S.owl.s===2)&&S.breath<=0){S.breath=1.6;sBreath();}
 if(S.callT>0){S.callT-=dt;S.bab-=dt;if(S.bab<=0){S.bab=.09;sBabble();}if(S.callT<=0)hideCall();}
 S.flick=Math.max(0,S.flick-dt);if(Math.random()<.002)S.flick=.15;
 S.gT-=dt;
 if(S.gT<=0&&!S.gold.on){S.gold.on=true;S.gold.t=4;S.gold.side=rnd(2)?'L':'R';S.gT=25+rnd(25);sSparkle();}
 if(S.gold.on){S.gold.t-=dt;if(S.gold.t<=0)S.gold.on=false;}
 S.mT-=dt;
 if(S.mT<=0){S.mT=18+rnd(20);if(S.mon.t<=0){S.mon.l=MONMSG[rnd(MONMSG.length)];S.mon.t=3;sGlitch();}}
 S.glT-=dt;
 if(S.glT<=0){S.glT=14+rnd(20);if(S.cam&&rnd(3)===0){S.glitch=.25;S.glt=rnd(6);sGlitch();}}
 S.ambT-=dt;
 if(S.ambT<=0){S.ambT=9+rnd(14);ambient();}
}
function showScreen(html){const s=$('screen');s.innerHTML=html;s.style.display='flex';}
function gameOver(){
 mode='dead';const t=S.js.type,n=S.n,pw=S.js.pw;
 save.deaths=(save.deaths||0)+1;save.best=Math.max(save.best||1,n);save.night=1;persist();
 const tip=pw?'Surveille ton énergie : sans courant, Bobino arrive.':TIPS[t];
 showScreen('<h2>'+NAMES[t]+' t\'a eu...</h2>'
  +'<p>Tu es mort pendant la nuit '+n+'. Les automates te ramènent au début : <b>retour à la NUIT 1</b>.</p>'
  +'<p class="tip">Conseil : '+tip+'</p>'
  +'<p class="st">Record : nuit '+save.best+' · Morts : '+save.deaths+' · ★ '+save.stars+'</p>'
  +'<button class="btn" id="rt">↺ RECOMMENCER — NUIT 1</button><button class="btn sm" id="mn">MENU</button>');
 $('rt').onclick=()=>startNight(1);$('mn').onclick=showTitle;
}
function win(){
 mode='win';const n=S.n;S.wt=T;sChime();hideCall();
 const last=n>=5;
 const pay=80+n*40,pw=Math.ceil(S.power);
 if(!last&&save.night<n+1)save.night=n+1;
 save.best=Math.max(save.best||1,last?5:n+1>5?5:n);
 if(last)save.night=1;
 persist();
 if(last){
  showScreen('<h1>6 AM</h1><h2>VICTOIRE !</h2><p>Tu as survécu aux 5 nuits au Cirque Mécanique. Les automates se sont rendormis... pour l\'instant.</p><p class="st">Salaire : '+pay+' € · Énergie restante : '+pw+'% · Morts : '+(save.deaths||0)+' · ★ '+save.stars+'</p><button class="btn" id="mn">MENU PRINCIPAL</button>');
  $('mn').onclick=showTitle;
 }else{
  showScreen('<h1>6 AM</h1><h2>Nuit '+n+' survivée !</h2><p class="st">Salaire : '+pay+' € · Énergie restante : '+pw+'%</p><p class="tip">'+NEXT[n]+'</p><button class="btn" id="nx">▶ NUIT '+(n+1)+'</button><button class="btn sm" id="mn">MENU</button>');
  $('nx').onclick=()=>startNight(n+1);$('mn').onclick=showTitle;
 }
}
function showHelp(){
 showScreen('<h2>COMMENT JOUER</h2>'
  +'<p>Survis de minuit à 6 h. Clique sur les boutons du bureau : PORTE, LUM., VENT et CAMERA. Chaque appareil consomme de l\'énergie.</p>'
  +'<p>Clavier : A / D portes · Q / E lumières · V vent · ESPACE caméra · 1-9 choisir la caméra · R remonter la boîte à musique.</p>'
  +'<p class="tip">Zozo s\'énerve si tu restes trop sur les caméras. Quand le Mime est dans le bureau : ne touche à rien ! Décroche le téléphone quand il sonne. Clique sur les posters, le ventilateur, la figurine et l\'écran : il y a des surprises.</p>'
  +'<button class="btn" id="bk">◀ RETOUR</button>');
 $('bk').onclick=showTitle;
}
function showTitle(){
 mode='title';S=null;regs=[];
 $('msg').style.display='none';
 if(buzzG)buzzG.gain.value=0;
 if(droneG)droneG.gain.value=.03;if(tensG)tensG.gain.value=0;
 const cont=save.night>1;
 showScreen('<h1>5 NUITS AU CIRQUE MÉCANIQUE</h1>'
  +'<p>Survis de minuit à 6 h face à 9 monstres. Portes, lumières, ventilation, 9 caméras... et ne meurs pas : sinon, retour à la nuit 1 !</p>'
  +'<p class="st">Record : nuit '+save.best+' · Morts : '+(save.deaths||0)+' · ★ '+(save.stars||0)+'</p>'
  +'<button class="btn" id="go">▶ '+(cont?'CONTINUER — NUIT '+save.night:'JOUER — NUIT 1')+'</button>'
  +(cont?'<button class="btn" id="nw">NOUVELLE PARTIE</button>':'')
  +'<button class="btn sm" id="hp">❓ AIDE</button>'
  +'<button class="btn sm" id="sn">🔊 SON : '+(muted?'OFF':'ON')+'</button>');
 $('go').onclick=()=>startNight(save.night);
 if(cont)$('nw').onclick=()=>{save.night=1;persist();startNight(1);};
 $('hp').onclick=showHelp;
 $('sn').onclick=()=>{audioInit();muted=!muted;if(mg)mg.gain.value=muted?0:.8;$('sn').textContent='🔊 SON : '+(muted?'OFF':'ON');};
}

/* ================= INPUT ================= */
const holds=new Map();
function toC(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();audioInit();
 if(mode!=='play'||!S||S.js||S.black||S.intro>0)return;
 const p=toC(e);
 for(let i=regs.length-1;i>=0;i--){
  const r=regs[i];
  if(p[0]>=r.x&&p[0]<=r.x+r.w&&p[1]>=r.y&&p[1]<=r.y+r.h){
   if(S.mime.here){kill('n');return;}
   PR[r.id]=.15;if(r.down)r.down();holds.set(e.pointerId,r);break;
  }
 }
});
function rel(e){const r=holds.get(e.pointerId);if(r){if(r.up)r.up();holds.delete(e.pointerId);}}
window.addEventListener('pointerup',rel);window.addEventListener('pointercancel',rel);
window.addEventListener('keydown',e=>{
 if(mode!=='play'||!S||e.repeat||S.intro>0||S.js||S.black)return;
 const k=e.key.toLowerCase();
 if('adqevr 123456789'.includes(k)&&k.length===1&&S.mime.here){kill('n');return;}
 if(k==='a')toggleDoor('L');else if(k==='d')toggleDoor('R');
 else if(k==='q')toggleLight('L');else if(k==='e')toggleLight('R');
 else if(k==='v')toggleVent();
 else if(k===' '){e.preventDefault();toggleCam();}
 else if(k==='r'){if(S.cam)S.wind=true;}
 else if('123456789'.includes(k)&&k.length===1)selCam(+k);
});
window.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='r'&&S)S.wind=false;});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= LOOP ================= */
let last=0;
function loop(ts){
 const dt=Math.min(.1,(ts-last)/1000||0);last=ts;T+=dt;
 if(mode==='play'&&S){if(!document.hidden)update(dt);if(mode==='play'&&S)drawPlay();}
 else if(mode==='title')drawTitle();
 else if(mode==='dead')drawDead();
 else if(mode==='win')drawWin();
 requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
})();
</script>
